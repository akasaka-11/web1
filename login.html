<meta charset="UTF-8">
<!-- Set the canvas colour immediately, before any stylesheet or external script loads. -->
<script>
(function () {
  var theme = 'light';
  try { if (localStorage.getItem('copperSpoonTheme') === 'night') theme = 'dark'; } catch (error) {}
  document.documentElement.setAttribute('data-bs-theme', theme);
})();
</script>
<style>
  html { background: #f5ead9; color-scheme: light; }
  html[data-bs-theme="dark"] { background: #1b110d; color-scheme: dark; }
</style>
<script src="js/theme.js?v=3" defer></script>

<main class="container auth-page mt-lg-5 mt-3 narrow-600">
<h1 class="text-center">Sign In</h1><p class="text-center">Access your Copper Spoon profile and saved reservation requests.</p>
<form id="loginForm" novalidate class="card p-4 shadow-sm mb-3">
<div class="mb-3"><label for="loginEmail" class="form-label">Email</label><input id="loginEmail" class="form-control" type="text" inputmode="email" autocomplete="email"></div>
<div class="mb-3"><label for="loginPassword" class="form-label">Password</label><input id="loginPassword" class="form-control" type="password" autocomplete="current-password"></div>
<button class="btn btn-copper w-100" type="submit">Sign In</button><div id="authFeedback" aria-live="polite"></div></form>
<p class="text-center">New here? <a href="register.html">Create an account</a></p>
