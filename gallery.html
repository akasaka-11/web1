<!-- Set the canvas colour immediately, before any stylesheet or external script loads. -->
<script>
(function () {
  var theme = 'light';
  try { if (localStorage.getItem('copperSpoonTheme') === 'night') theme = 'dark'; } catch (error) {}
  document.documentElement.setAttribute('data-bs-theme', theme);
})();
</script>
<style>
  html { background: #f5ead9; color-scheme: light; }
  html[data-bs-theme="dark"] { background: #1b110d; color-scheme: dark; }
