<div class="container mt-lg-5 mt-3 px-sm-2 narrow-600">
  <h1 class="text-center">Create an Account</h1>
  <p class="text-center mb-4">Join The Copper Spoon club to get early access to seasonal menus.</p>

  <!-- TASK 1: registration form with validation -->
  <form id="registerForm" class="card p-lg-4 p-3 shadow-sm mb-5 needs-validation" novalidate data-success="Account created successfully! Welcome to The Copper Spoon.">
    <div class="mb-3">
      <label for="regName" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="regName" name="name" data-label="Full name" minlength="2" placeholder="Your name" required>
    </div>
    <div class="mb-3">
      <label for="regEmail" class="form-label">Email</label>
      <input type="email" class="form-control" id="regEmail" name="email" data-label="Email" placeholder="you@example.com" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" data-label="Password" minlength="8" data-strong placeholder="At least 8 characters, letters and numbers" required>
    </div>
    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" data-label="Password confirmation" data-match="#password" placeholder="Repeat your password" required>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
      <label class="form-check-label" for="terms">I agree to the terms and conditions</label>
    </div>
    <button type="submit" class="btn btn-copper w-100">Sign Up</button>
  </form>
</div>
